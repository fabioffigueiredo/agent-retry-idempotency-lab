[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-retry-lab"
version = "0.1.0"
description = "Reproducible post-commit retry and idempotency lab with SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_retry_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
